<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e1f22">
<title>Concord</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="favicon.png?v=3">
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@17.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
<style>
@font-face{font-family:"gg sans";src:url("ggsans-Normal.woff2") format("woff2");font-weight:400}
@font-face{font-family:"gg sans";src:url("ggsans-Medium.woff2") format("woff2");font-weight:500}
@font-face{font-family:"gg sans";src:url("ggsans-Semibold.woff2") format("woff2");font-weight:600}
@font-face{font-family:"gg sans";src:url("ggsans-Bold.woff2") format("woff2");font-weight:700}
:root{--brand:#74cc20;--brand-h:#63ad1b;--bg1:#1e1f22;--bg2:#2b2d31;--bg3:#313338;--hov:#35373c;--txt:#f2f3f5;--mut:#949ba4;--inp:#1e1f22;--err:#f23f42}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"gg sans","Noto Sans","Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg3);color:var(--txt);overflow:hidden;font-size:16px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 20% 15%,#2f5f12 0,transparent 45%),radial-gradient(circle at 85% 90%,#1d3d0b 0,transparent 50%),var(--bg1)}
.card{width:100%;max-width:480px;background:var(--bg3);border-radius:8px;padding:32px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.logo{display:block;width:64px;height:64px;margin:0 auto 16px;border-radius:16px}
.card h1{margin:0 0 8px;font-size:24px;font-weight:600;text-align:center}
.card .sub{margin:0 0 20px;text-align:center;color:var(--mut)}
.card label{display:block;margin:16px 0 8px;font-size:12px;font-weight:700;color:#b5bac1;text-transform:uppercase}
.card input{width:100%;height:40px;padding:10px;border:0;border-radius:3px;background:var(--inp)}
.link{background:none;color:var(--brand);padding:0;font-size:14px}
.link:hover{text-decoration:underline}
.btn{width:100%;height:44px;margin-top:20px;border-radius:3px;background:var(--brand);color:#0b1a02;font-weight:600;transition:background-color .17s}
.btn:hover{background:var(--brand-h)}
.err{margin-top:12px;min-height:18px;font-size:14px;color:var(--err)}
.foot{margin-top:8px;font-size:14px;color:var(--mut)}

/* ---------- APP ---------- */
#app{height:100%;display:grid;grid-template-columns:72px 240px 1fr 240px}
#servers{background:var(--bg1);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto}
.sv{width:48px;height:48px;border-radius:50%;background:var(--bg3);font-weight:600;transition:border-radius .17s,background-color .17s;position:relative;flex:none}
.sv:hover,.sv.on{border-radius:16px;background:var(--brand);color:#0b1a02}
.sv.add{color:var(--brand);font-size:24px}
.sv.add:hover{color:#0b1a02}
.sep{width:32px;height:2px;background:var(--hov);border-radius:1px;flex:none}
#side{background:var(--bg2);display:flex;flex-direction:column;min-width:0}
#sname{height:48px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:600;border-bottom:1px solid var(--bg1);box-shadow:0 1px 0 rgba(0,0,0,.1)}
#sname button{background:none;color:var(--mut);font-size:12px}
#sname button:hover{color:var(--txt)}
#chans{flex:1;overflow-y:auto;padding:16px 8px}
.chead{display:flex;justify-content:space-between;padding:0 8px 4px;font-size:12px;font-weight:600;color:var(--mut)}
.chead button{background:none;color:var(--mut);font-size:18px;line-height:1}
.chead button:hover{color:var(--txt)}
.ch{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:4px;background:none;color:var(--mut);font-weight:500}
.ch:hover{background:var(--hov);color:#dbdee1}
.ch.on{background:#404249;color:#fff}
.ch i{font-style:normal;opacity:.7;margin-right:6px}
#me{height:52px;background:#232428;display:flex;align-items:center;gap:8px;padding:0 8px}
#me .nm{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#me .nm small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
#me button{background:none;color:var(--mut);font-size:12px;padding:6px;border-radius:4px}
#me button:hover{background:var(--hov);color:var(--txt)}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:15px;color:#0b1a02;position:relative}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#chtitle{height:48px;padding:0 16px;display:flex;align-items:center;font-weight:600;border-bottom:1px solid var(--bg1);box-shadow:0 1px 0 rgba(0,0,0,.1)}
#chtitle i{font-style:normal;color:var(--mut);margin-right:8px;font-size:22px}
#msgs{flex:1;overflow-y:auto;padding:16px 0}
.empty{padding:32px 16px;color:var(--mut)}
.empty h2{color:var(--txt);margin:0 0 4px}
.m{display:flex;gap:16px;padding:2px 16px 2px 16px}
.m:hover{background:rgba(2,2,2,.06)}
.m.first{margin-top:16px;padding-top:4px}
.m .av{width:40px;height:40px;margin-top:2px}
.m .sp{width:40px;flex:none;font-size:11px;color:var(--mut);text-align:right;opacity:0;line-height:22px}
.m:hover .sp{opacity:1}
.m .bd{min-width:0}
.m .hd{line-height:22px}
.m .hd b{font-weight:600;margin-right:8px}
.m .hd span{font-size:12px;color:var(--mut)}
.m .tx{line-height:22px;white-space:pre-wrap;overflow-wrap:anywhere;color:#dbdee1}
#form{display:flex;align-items:flex-end;gap:8px;padding:0 16px 24px}
#form input,#form textarea{width:100%;height:44px;padding:0 16px;border:0;border-radius:8px;background:#383a40}
#form textarea{color:var(--txt);min-height:44px;max-height:160px;padding:12px 16px;resize:none;line-height:20px;font:inherit;overflow-y:auto}
#form input::placeholder,#form textarea::placeholder{color:var(--mut)}
#sendBtn{display:none;background:var(--brand);color:#0b1a02}
@media(pointer:coarse){#sendBtn{display:grid}}
#members{background:var(--bg2);overflow-y:auto;padding:16px 8px}
#members h3{margin:8px 8px 4px;font-size:12px;font-weight:600;color:var(--mut)}
.mb{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:4px;font-weight:500}
.mb:hover{background:var(--hov)}
.mb.off{opacity:.45}
.mb .av{width:32px;height:32px;font-size:13px}
.dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:#23a55a;border:3px solid var(--bg2);box-sizing:content-box;width:10px;height:10px}
.mb.off .dot{background:#80848e}
/* ---------- MODAIS ---------- */
#ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.7)}
.md{position:relative;width:100%;max-width:440px;max-height:100%;overflow-y:auto;background:var(--bg2);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.md .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:4px;background:none;color:var(--mut);font-size:26px;line-height:1}
.md .x:hover{color:var(--txt)}
.md .pad{padding:24px 16px 16px}
.md h2{margin:8px 24px;text-align:center;font-size:24px;line-height:30px;font-weight:600}
.md p{margin:8px 8px 20px;text-align:center;color:#b5bac1;line-height:20px}
.md .lb{display:block;margin:4px 0 8px;font-size:12px;font-weight:700;color:#b5bac1;text-transform:uppercase}
.md input{width:100%;height:40px;padding:10px;border:0;border-radius:3px;background:var(--inp)}
.opt{display:flex;align-items:center;gap:16px;width:100%;height:60px;padding:0 16px;border:1px solid #3f4147;border-radius:8px;background:var(--bg3);font-weight:500;text-align:left}
.opt:hover{background:var(--hov)}
.opt .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--brand);color:#0b1a02;font-weight:700;font-size:20px}
.opt .arr{margin-left:auto;color:var(--mut);font-size:22px}
.foot1{padding:0 16px 16px;text-align:center}
.foot1 h3{margin:8px 0 16px;font-size:20px;font-weight:600}
.foot2{display:flex;justify-content:space-between;gap:8px;padding:16px;background:#232428}
.b2{height:38px;padding:0 16px;border-radius:3px;font-weight:500;transition:background-color .17s}
.b2.wide{width:100%}
.b2.sec{background:#4e5058}.b2.sec:hover{background:#6d6f78}
.b2.pri{background:var(--brand);color:#0b1a02}.b2.pri:hover{background:var(--brand-h)}
.b2.lnk{background:none}.b2.lnk:hover{text-decoration:underline}
.copy{display:flex;gap:8px}.copy input{flex:1}
/* ---------- CONVITE POR LINK ---------- */
.tx a{color:var(--brand);text-decoration:none}
.tx a:hover{text-decoration:underline}
.inv{margin-top:8px;max-width:432px;padding:16px;border:1px solid #232428;border-radius:8px;background:var(--bg2)}
.md .inv{margin:0 0 4px;background:var(--bg3);max-width:none}
.inv .invh{margin-bottom:12px;font-size:12px;font-weight:700;color:var(--mut)}
.inv .invr{display:flex;align-items:center;gap:16px}
.invic{width:50px;height:50px;border-radius:16px;flex:none;display:grid;place-items:center;background:var(--brand);color:#0b1a02;font-weight:700}
.invi{flex:1;min-width:0}
.invi b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.invi small{color:var(--mut)}
.inv .b2:disabled{opacity:.5;cursor:default}
/* ---------- MENSAGENS DIRETAS ---------- */
.sv.home,.sv.home:hover,.sv.home.on{background:url(logo.png) center/cover}
.sv.home{opacity:.85}
.sv.home:hover,.sv.home.on{opacity:1}
.find{width:100%;height:28px;margin-bottom:12px;padding:0 8px;border-radius:4px;background:var(--bg1);color:var(--mut);font-size:13px;text-align:left}
.ch.dm{display:flex;align-items:center;gap:12px;padding:6px 8px}
.ch.dm .av{width:32px;height:32px;font-size:13px}
.ch.dm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chans .empty{padding:16px 8px;font-size:14px}
.ulist{max-height:260px;overflow-y:auto;margin-top:8px}
.urow{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border-radius:4px;background:none;text-align:left;font-weight:500;cursor:pointer}
.urow:hover{background:var(--hov)}
.urow .av{width:32px;height:32px;font-size:13px}
.md .urow input{width:18px;height:18px;padding:0;accent-color:var(--brand)}
.uempty{padding:16px;text-align:center;color:var(--mut)}
/* ---------- PERFIL ---------- */
#me .av,#me .nm,.mb,.lk{cursor:pointer}
.hd b.lk:hover{text-decoration:underline}
.md:has(.pbanner) .x{color:#0b1a02}
.pbanner{height:100px;background:var(--brand)}
.pbody{padding:0 16px 16px}
.av.big{width:92px;height:92px;border:6px solid var(--bg2);margin-top:-46px;font-size:38px;cursor:default}
.pname{margin-top:8px;font-size:20px;font-weight:700;overflow-wrap:anywhere}
.pst{font-size:14px;color:var(--mut)}
.av.big .dot{width:18px;height:18px;right:-6px;bottom:-6px;border-width:5px;border-color:var(--bg2)}
.dot.off{background:#80848e}
.pst:empty{display:none}
.pact{margin:16px 0}
.pcard{padding:12px;border-radius:8px;background:var(--bg1)}
.pcard h4{margin:0 0 4px;font-size:12px;font-weight:700;color:#b5bac1}
.pcard div+h4{margin-top:16px}
.pbio{font-size:14px;line-height:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.pbio.nil{color:var(--mut)}
.md textarea{width:100%;min-height:96px;resize:vertical;padding:10px;border:0;border-radius:3px;background:var(--inp);font:inherit;color:inherit}
/* ---------- EDIÇÃO NO PERFIL E IMAGENS ---------- */
.ed{cursor:text;border-radius:4px;transition:background-color .17s}
.ed:hover{background:var(--hov)}
.pname.ed{margin-left:-4px;padding:2px 4px}
.pbio.ed{margin:-4px;padding:4px}
.md .ei{width:100%;height:auto;padding:6px 8px;border:0;border-radius:3px;background:var(--inp);color:inherit;font:inherit;outline:2px solid var(--brand)}
.md textarea.ei{min-height:84px;resize:vertical}
.av.chg{cursor:pointer}
.av.chg:hover::after{content:"Trocar";position:absolute;inset:0;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600}
.phint{margin-top:12px;min-height:16px;font-size:12px;color:var(--mut)}
.phint .link{margin-left:8px;font-size:12px}
#attach{width:44px;height:44px;flex:none;border-radius:8px;background:#383a40;color:var(--mut);font-size:24px}
#attach:hover:not(:disabled){color:var(--txt)}
#attach:disabled{opacity:.5;cursor:default}
.pic{margin-top:4px;max-width:100%;border-radius:8px;overflow:hidden;background:var(--bg2);cursor:zoom-in}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.lbimg{max-width:100%;max-height:100%;border-radius:8px;cursor:zoom-out}
.pact{display:flex;gap:8px;align-items:center}
.pact:empty,.pfoot:empty{display:none}
.pfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.phint{margin-top:8px;font-size:13px;color:var(--err)}
.phint:empty{display:none}
/* ---------- AMIGOS ---------- */
.puser{font-size:14px;color:var(--mut)}.puser:empty{display:none}
.ch.dm .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch.dm small,.rq small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.rq{display:flex;align-items:center;gap:12px;padding:6px 8px}
.rq .av{width:32px;height:32px;font-size:13px}
.rq .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.rqb{width:32px;height:32px;border-radius:50%;background:var(--bg1);color:var(--mut);font-size:16px}
.rqb:hover{color:var(--txt)}.rqb.ok:hover{background:var(--brand);color:#0b1a02}
.at{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border-radius:3px;background:var(--inp)}
.at b{color:var(--mut)}.md .at input{height:100%;padding:0;background:none}
.ok2{color:var(--brand)}
body[data-req]:not([data-req="0"]) #homeBtn::after{content:"";position:absolute;right:-2px;top:-2px;width:12px;height:12px;border-radius:50%;background:var(--err);border:3px solid var(--bg1);box-sizing:content-box}
/* ---------- GIF / EMOJI / ÁUDIO ---------- */
#main{position:relative}
.fb{width:40px;height:44px;flex:none;border-radius:8px;background:#383a40;color:var(--mut);font-size:12px;font-weight:700;display:grid;place-items:center}
.fb:hover,.fb.on{color:var(--txt)}.fb .i{width:22px;height:22px}
#recbar{display:none;flex:1;align-items:center;gap:12px;height:44px;padding:0 8px 0 16px;border-radius:8px;background:#383a40}
#form.rec>*:not(#recbar){display:none}#form.rec #recbar{display:flex}
#recbar .grow{flex:1}.rdot{width:10px;height:10px;border-radius:50%;background:var(--err);animation:rb 1s infinite}
@keyframes rb{50%{opacity:.25}}
#recbar button{width:36px;height:36px;border-radius:50%;background:none;color:var(--mut);display:grid;place-items:center}
#recbar button:hover{color:var(--txt)}#recOk{background:var(--brand)!important;color:#0b1a02!important}
#recbar .i{width:20px;height:20px}
#pick{display:none;position:absolute;right:16px;bottom:76px;z-index:6;width:min(400px,calc(100% - 32px));height:min(420px,70%);flex-direction:column;border-radius:8px;background:var(--bg2);box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden}
#pick.on{display:flex}
.phd{padding:10px}.phd input{width:100%;height:36px;padding:0 12px;border:0;border-radius:4px;background:var(--inp);font-size:14px}
.pbd{flex:1;min-height:0;overflow-y:auto;padding:0 10px 10px}
.pft{display:flex;gap:2px;justify-content:center;padding:6px;background:var(--bg1);font-size:11px;color:var(--mut);align-items:center}
.pft button{width:32px;height:32px;border-radius:6px;background:none;color:var(--mut);display:grid;place-items:center}
.pft button:hover{background:var(--hov);color:var(--txt)}.pft .i{width:18px;height:18px}
.pbd h4{margin:10px 0 4px;font-size:12px;color:var(--mut);text-transform:uppercase}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr))}
.em{height:36px;border-radius:6px;background:none;font-size:24px;line-height:1;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.em:hover{background:var(--hov)}
.gg{columns:2;column-gap:6px}
.gi{position:relative;margin-bottom:6px;break-inside:avoid}
.gi img{display:block;width:100%;min-height:60px;border-radius:6px;background:var(--bg1);cursor:pointer}
.gi .gs{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:none;place-items:center}
.gi:hover .gs,.gi .gs.on{display:grid}
.gs .i{width:16px;height:16px}.gs.on .i{fill:#ffd43b;color:#ffd43b}
@media(pointer:coarse){.gi .gs{display:grid}}
.gifmsg{display:block;margin-top:4px;max-width:min(320px,100%);max-height:300px;border-radius:8px;cursor:zoom-in}
.aud{display:flex;align-items:center;gap:10px;margin-top:4px;width:min(300px,100%);padding:8px 12px 8px 8px;border-radius:24px;background:var(--bg2)}
.aud .ap{width:36px;height:36px;flex:none;border-radius:50%;background:var(--brand);color:#0b1a02;display:grid;place-items:center}
.aud .ap .i{width:16px;height:16px;fill:currentColor}
.abar{flex:1;height:6px;border-radius:3px;background:var(--bg1);cursor:pointer;overflow:hidden}
.abar i{display:block;height:100%;width:0;background:var(--brand)}
.at2{font-size:12px;color:var(--mut);min-width:32px;text-align:right}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:20;max-width:90%;padding:10px 16px;border-radius:8px;background:#111;color:#fff;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
@media(max-width:700px){#pick{right:8px;left:8px;width:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px))}.fb{width:36px}#form{gap:4px}}
/* só emojis: ficam grandes */
.tx.jumbo{font-size:2.2em;line-height:1.25}
img.emoji{display:inline-block;width:1.25em;height:1.25em;margin:0 .05em;vertical-align:-.3em}
.em img.emoji{width:24px;height:24px;margin:0;vertical-align:middle}
/* ---------- MENÇÕES ---------- */
#mpop{display:none;position:absolute;left:16px;bottom:76px;z-index:6;width:min(380px,calc(100% - 32px));max-height:300px;overflow-y:auto;padding:6px;border-radius:8px;background:var(--bg2);box-shadow:0 8px 24px rgba(0,0,0,.5)}
#mpop.on{display:block}
.mi{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:4px;cursor:pointer}
.mi.on,.mi:hover{background:var(--hov)}
.mi .av,.mi .mic{width:28px;height:28px;flex:none;font-size:12px}
.mi .mic{display:grid;place-items:center;border-radius:50%;background:var(--bg1);color:var(--brand)}
.mi .mic .i{width:16px;height:16px}
.mi b{font-weight:600}.mi small{margin-left:auto;padding-left:12px;color:var(--mut);font-size:12px;text-align:right}
.mention{padding:0 3px;border-radius:3px;background:rgba(116,204,32,.18);color:var(--brand);font-weight:500;cursor:pointer}
.mention:hover{background:var(--brand);color:#0b1a02}
.m.ment{background:rgba(250,166,26,.08);box-shadow:inset 3px 0 0 #faa61a}
@media(max-width:700px){#mpop{left:8px;right:8px;width:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
/* ---------- RESPONDER / EXCLUIR ---------- */
.m{position:relative}
.mt{display:none;position:absolute;right:16px;top:-16px;z-index:2;gap:2px;padding:2px;border-radius:6px;background:var(--bg2);box-shadow:0 0 0 1px var(--bg1),0 2px 6px rgba(0,0,0,.3)}
.m:hover .mt,.m.sel .mt{display:flex}
.mt button{width:30px;height:30px;border-radius:4px;background:none;color:var(--mut);display:grid;place-items:center}
.mt button:hover{background:var(--hov);color:var(--txt)}.mt .del:hover{color:var(--err)}.mt .i{width:18px;height:18px}

// reduz a imagem no navegador e devolve base64 (data URL JPEG)
function shrink(file,max,q,square){
  return new Promise((ok,no)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.width,h=img.height,sx=0,sy=0,sw=w,sh=h;
      if(square){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;w=h=Math.min(max,m)}
      else{const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k)}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,sx,sy,sw,sh,0,0,w,h);
      ok({url:c.toDataURL('image/jpeg',q),w,h});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);no(new Error('img'))};
    img.src=url;
  });
}

async function ensureUsername(){

onAuthStateChanged(auth,u=>{
  me=u;

  if(!u){['srv','ch','mem','msg','dm','fr','rq'].forEach(stop);friendList={};reqList={};myUser='';cur={sid:null,cid:null};return}
  const name=u.displayName||u.email.split('@')[0];
  $('meName').textContent=name;
  $('meAv').replaceWith(Object.assign(avatar(name,u.uid),{id:'meAv'}));
  $('meAv').insertAdjacentHTML('beforeend','<span class="dot"></span>');
  update(ref(db,'users/'+u.uid),{name,createdAt:Date.parse(u.metadata.creationTime)||Date.now()}).catch(()=>{});
  if(!regBusy)ensureUsername();
  stop('fr');un.fr=onValue(ref(db,'friends/'+u.uid),s=>{friendList=s.val()||{};if(cur.home)drawDms()});
  stop('rq');un.rq=onValue(ref(db,'friendRequests/'+u.uid),s=>{reqList=s.val()||{};document.body.dataset.req=Object.keys(reqList).length;if(cur.home)drawDms()});
  // presença
  const pr=ref(db,'presence/'+u.uid);
  get(ref(db,'users/'+u.uid+'/status')).then(v=>v.val()).catch(()=>null).then(v=>{
    myStatus=ST[v]?v:'online';paintMe();
    onValue(ref(db,'.info/connected'),s=>{if(s.val()){onDisconnect(pr).set('offline');set(pr,myStatus)}});
  });
  onValue(ref(db,'presence'),s=>{pres=s.val()||{};drawMembers()});
  onValue(ref(db,'avatars'),s=>{photos=s.val()||{};document.querySelectorAll('.av[data-uid]').forEach(applyPhoto)});
  // servidores
  stop('srv');
  un.srv=onValue(ref(db,'userServers/'+u.uid),s=>{
    const list=s.val()||{};srvList=list;syncSrv(list);drawServers(list);
    if(!list[cur.sid]&&!cur.home){const first=Object.keys(list)[0];first?pickServer(first,list[first].name):goHome()}
  });
  if(inviteParam){const k=inviteParam;inviteParam=null;history.replaceState(null,'',location.pathname);inviteModal(k)}
});

let srvList={},srvMeta={},srvUn={},imgCache={};
const loadImg=async id=>{if(imgCache[id])return imgCache[id];const v=(await get(ref(db,'images/'+id))).val();if(v)imgCache[id]=v;return v};
function syncSrv(list){
  for(const id of Object.keys(srvUn))if(!list[id]){srvUn[id]();delete srvUn[id];delete srvMeta[id]}
  for(const id of Object.keys(list))if(!srvUn[id])srvUn[id]=onValue(ref(db,'servers/'+id),sn=>{
    if(!sn.exists()){remove(ref(db,'userServers/'+me.uid+'/'+id)).catch(()=>{});return} // servidor excluído
    srvMeta[id]=sn.val();drawServers(srvList);if(cur.sid===id)srvHead();
  });
}
function srvHead(){const m=srvMeta[cur.sid];if(!m)return;$('sTitle').textContent=m.name;$('srvSet').classList.toggle('hidden',m.owner!==me.uid)}
function paintSrv(b,sid,nm){
  const m=srvMeta[sid]||{};b.textContent=nm.slice(0,2).toUpperCase();b.style.backgroundImage='';
  if(m.icon)loadImg(m.icon).then(u=>{if(u&&b.isConnected){b.style.backgroundImage='url("'+u+'")';b.textContent=''}}).catch(()=>{});
}

  let name=isMe?myName():(u.name||'Usuário'),bio=u.bio||'';

async function saveProfile(name,bio){
  const changed=name!==myName();

  await update(ref(db,'users/'+me.uid),{name,bio});
  $('meName').textContent=name;
  $('meAv').replaceWith(Object.assign(avatar(name,me.uid),{id:'meAv'}));
  $('meAv').insertAdjacentHTML('beforeend','<span class="dot"></span>');
  if(!changed)return;
  try{ // atualiza o nome nas listas de membros e conversas
    const [sv,dm]=await Promise.all([get(ref(db,'userServers/'+me.uid)),get(ref(db,'userDms/'+me.uid))]);
    const up={};
    Object.keys(sv.val()||{}).forEach(id=>up['servers/'+id+'/members/'+me.uid+'/name']=name);
    Object.entries(dm.val()||{}).forEach(([id,x])=>{
      up['dms/'+id+'/members/'+me.uid+'/name']=name;
      if(!x.group&&x.peer)set(ref(db,'userDms/'+x.peer+'/'+id+'/name'),name).catch(()=>{});
    });
    Object.keys(friendList).forEach(f=>update(ref(db,'friends/'+f+'/'+me.uid),{name}).catch(()=>{}));
    await update(ref(db),up);
  }catch{}
}

async function requestTo(uid){
  if(uid===me.uid)throw 'Você não pode adicionar a si mesmo.';

  await set(ref(db,'friendRequests/'+uid+'/'+me.uid),{name:myName(),username:myUser,ts:Date.now()});
  return 'sent';
}

const KEY=/^[-\w]{10,}$/;

function richText(text){
  const d=el('div','tx');let i=0,inv=null;
  for(const m of text.matchAll(/https?:\/\/[^\s<>]+/g)){
    d.append(document.createTextNode(text.slice(i,m.index)));
    const a=el('a','',m[0]);a.href=m[0];d.append(a);
    i=m.index+m[0].length;
    if(!inv){try{const k=new URL(m[0]).searchParams.get('convite');if(k&&KEY.test(k))inv=k}catch{}}
  }
  d.append(document.createTextNode(text.slice(i)));
  return [d,inv];
}

function pollBox(m){
  const p=m.poll,box=el('div','poll'),sub=el('small'),list=el('div'),foot=el('div','pll');
  box.append(el('h5','',String(p.q||'').slice(0,300)),sub,list,foot);
  let state=m;
  const draw=mm=>{
    state=mm;const votes=mm.votes||{},opts=Array.isArray(p.opts)?p.opts:[],ended=Date.now()>=(p.end||0);
    box.classList.toggle('multi',!!p.multi);
    sub.textContent=ended?'Enquete encerrada':(p.multi?'Selecione uma ou mais respostas':'Selecione uma resposta');
    const counts=opts.map(()=>0);let voters=0;
    for(const v of Object.values(votes)){let any=false;for(const [k,on] of Object.entries(v||{})){const i=+String(k).slice(1);if(on&&i>=0&&i<counts.length){counts[i]++;any=true}}if(any)voters++}
    const mine=votes[me.uid]||{};
    list.innerHTML='';
    opts.forEach((t,i)=>{
      const b=el('button','po'+(mine['o'+i]?' on':''));b.type='button';b.disabled=ended;
      const pct=voters?Math.round(counts[i]*100/voters):0,f=el('span','po-f'),c=el('span','po-c');
      f.style.width=pct+'%';c.innerHTML=ic('check');
      b.append(f,c,el('span','po-t',String(t).slice(0,60)),el('span','po-n',counts[i]+(voters?' · '+pct+'%':'')));
      b.onclick=()=>vote(i);list.append(b);
    });
    foot.textContent=voters+(voters===1?' voto':' votos')+' · '+(ended?'encerrada':'termina '+fmtEnd(p.end||0));
  };
  const vote=async i=>{
    if(Date.now()>=(p.end||0))return draw(state);
    const mine={...((state.votes||{})[me.uid]||{})},k='o'+i,had=!!mine[k];
    if(!p.multi)for(const x of Object.keys(mine))delete mine[x];
    if(p.multi)had?delete mine[k]:mine[k]=true;else if(!had)mine[k]=true;
    const empty=!Object.keys(mine).length,nv={...(state.votes||{})};
    if(empty)delete nv[me.uid];else nv[me.uid]=mine;
    draw({...state,votes:nv});
    try{await set(ref(db,msgPath()+'/'+m.id+'/votes/'+me.uid),empty?null:mine)}
    catch{toast('Não foi possível registrar o voto.');draw(msgList.find(x=>x.id===m.id)||m)}
  };
  pollRefresh[m.id]=draw;draw(m);
  const left=(p.end||0)-Date.now();if(left>0&&left<2147483000)setTimeout(()=>draw(state),left+500);
  return box;
}

let rec=null;const fmtT=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
async function startRec(){
  if(!canSend()||rec)return;
  if(!navigator.mediaDevices||!window.MediaRecorder)return toast('Seu navegador não suporta gravação de áudio.');
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch{return toast('Permita o uso do microfone para gravar.')}
  closePick();
  const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const mr=new MediaRecorder(stream,mt?{mimeType:mt,audioBitsPerSecond:32000}:{audioBitsPerSecond:32000});
  const r=rec={mr,stream,chunks:[],t0:Date.now(),send:false};
  mr.ondataavailable=e=>{if(e.data.size)r.chunks.push(e.data)};
  mr.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());clearInterval(r.iv);rec=null;$('form').classList.remove('rec');
    if(!r.send||!r.chunks.length)return;
    const dur=Math.max(1,Math.round((Date.now()-r.t0)/1000));
    try{
      const url=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=no;f.readAsDataURL(new Blob(r.chunks,{type:mr.mimeType||mt}))});
      if(url.length>400000)return toast('Áudio muito longo. Grave até 1 minuto.');
      const id=push(ref(db,'images')).key;await set(ref(db,'images/'+id),url);
      await post({aud:id,adur:dur});
    }catch{toast('Não foi possível enviar o áudio.')}
  };
  mr.start();$('form').classList.add('rec');$('recT').textContent='0:00';
  r.iv=setInterval(()=>{const s=(Date.now()-r.t0)/1000;$('recT').textContent=fmtT(s);if(s>=60)stopRec(true)},250);
}

const uname={};
function fillUnames(){
  if(me&&myUser)uname[me.uid]=myUser;

const menCtx=()=>!!(cur.sid&&cur.cid)||!!(cur.dm&&dmList[cur.dm]&&dmList[cur.dm].group);
const MEN_RE=/(^|\s)@([\p{L}\p{N}_.]+)/gu,ALL=['everyone','here'];
function mentionData(text){
  if(!menCtx())return{};
  const byU={};for(const uid of Object.keys(members))if(uname[uid])byU[uname[uid].toLowerCase()]=uid;
  const mn={};let ev='';
  for(const t of text.matchAll(MEN_RE)){
    let k=t[2].toLowerCase();if(!byU[k]&&!ALL.includes(k))k=k.replace(/\.+$/,'');
    if(k==='everyone')ev='everyone';else if(k==='here'){if(!ev)ev='here'}else if(byU[k])mn[byU[k]]=uname[byU[k]];
  }
  return {...(Object.keys(mn).length?{mn}:{}),...(ev?{ev}:{})};
}
function mentify(tx,m){
  const mn=m.mn||{},byU={};
  for(const [uid,u] of Object.entries(mn))byU[u.toLowerCase()]=uid;
  for(const node of [...tx.childNodes]){
    if(node.nodeType!==3)continue;
    const t=node.textContent,re=new RegExp(MEN_RE.source,'gu');let i=0,frag=null,x;
    while((x=re.exec(t))){
      let tok=x[2],k=tok.toLowerCase();
      if(!byU[k]&&!ALL.includes(k)){const k2=k.replace(/\.+$/,'');if(byU[k2]||ALL.includes(k2)){tok=tok.slice(0,k2.length);k=k2}}
      const uid=byU[k],all=ALL.includes(k);
      if(!uid&&!(all&&m.ev))continue;
      frag=frag||document.createDocumentFragment();
      const start=x.index+x[1].length;
      frag.append(t.slice(i,start));
      const sp=el('span','mention','@'+(uid?((members[uid]&&members[uid].name)||mn[uid]):k));
      if(uid)sp.onclick=()=>profileView(uid);
      frag.append(sp);i=start+1+tok.length;
    }
    if(frag){frag.append(t.slice(i));node.replaceWith(frag)}
  }
}

function menCandidates(q){
  const n=norm(q),out=[];
  for(const [k,d] of [['everyone','Notifica todos os membros'],['here','Notifica só quem está online']])if(k.startsWith(n))out.push({k,d});
  const sw=x=>norm(x.u).startsWith(n)||norm(x.name).startsWith(n);
  const mem=Object.entries(members).map(([uid,m])=>({uid,name:m.name||'?',u:uname[uid]||''}))
    .filter(x=>x.u&&(!n||norm(x.u).includes(n)||norm(x.name).includes(n)))
    .sort((a,b)=>sw(b)-sw(a)||a.name.localeCompare(b.name));
  return out.concat(mem.slice(0,8));
}
function drawMen(){
  mpop.innerHTML='';
  men.list.forEach((it,idx)=>{
    const r=el('div','mi'+(idx===men.i?' on':''));
    if(it.k){const ic_=el('span','mic');ic_.innerHTML=ic('users');r.append(ic_,Object.assign(el('b'),{textContent:'@'+it.k}),el('small','',it.d))}
    else r.append(avatar(it.name,it.uid),el('b','',it.name),el('small','','@'+it.u));
    r.onmousedown=e=>{e.preventDefault();pickMen(it)};
    mpop.append(r);
  });
  const on=mpop.querySelector('.on');if(on)on.scrollIntoView({block:'nearest'});
}
function updateMen(){
  const inp=$('msgIn');
  if(!menCtx()){return closeMen()}
  const c=inp.selectionStart??inp.value.length,m=/(^|\s)@([\p{L}\p{N}_.]*)$/u.exec(inp.value.slice(0,c));
  if(!m)return closeMen();
  fillUnames();
  men.q=m[2];men.from=c-m[2].length-1;men.list=menCandidates(m[2]);
  if(!men.list.length)return closeMen();
  men.open=true;men.i=Math.min(men.i,men.list.length-1);mpop.classList.add('on');closePick();drawMen();
}
function pickMen(it){
  const inp=$('msgIn'),c=inp.selectionStart??inp.value.length,ins='@'+(it.k||it.u)+' ';
  inp.setRangeText(ins,men.from,c,'end');growIn();inp.focus();closeMen();
}
function growIn(){const t=$('msgIn');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px';$('form').classList.toggle('typing',!!t.value.trim()||!!pendImg)}
$('msgIn').addEventListener('input',()=>{growIn();men.i=0;updateMen()});
$('msgIn').addEventListener('click',updateMen);
$('msgIn').addEventListener('blur',()=>setTimeout(closeMen,120));
$('msgIn').addEventListener('keydown',e=>{
  if(!men.open)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();men.i=(men.i+(e.key==='ArrowDown'?1:-1)+men.list.length)%men.list.length;drawMen()}
  else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();pickMen(men.list[men.i])}
  else if(e.key==='Escape'){e.preventDefault();closeMen()}
});
// Enter envia; Shift+Enter pula linha (no celular, Enter pula linha e o botão envia)
$('msgIn').addEventListener('keydown',e=>{

  e.preventDefault();
  const f=$('form');f.requestSubmit?f.requestSubmit():f.dispatchEvent(new Event('submit',{cancelable:true}));
});

function listenMsgs(q){
  const a=onChildAdded(q,s=>{
    const m={...s.val(),id:s.key};
    if(msgList.length&&(m.ts||0)<(msgList[msgList.length-1].ts||0)){msgList.push(m);msgList.sort((x,y)=>(x.ts||0)-(y.ts||0));redraw()} // mensagem antiga entrou na janela
    else addMsg(m);
  });
  const b=onChildRemoved(q,s=>{msgList=msgList.filter(x=>x.id!==s.key);redraw()});
  const c=onChildChanged(q,s=>{const m={...s.val(),id:s.key},i=msgList.findIndex(x=>x.id===m.id);if(i>=0){msgList[i]=m;if(pollRefresh[m.id])pollRefresh[m.id](m)}}); // votos em tempo real
  return()=>{a();b();c()};
}
function redraw(){
  const box=$('msgs'),st=box.scrollTop,list=msgList;
  msgList=[];last=null;box.innerHTML='';list.forEach(m=>addMsg(m,true));box.scrollTop=st;
}
async function loadOwner(){
  ownerUid=null;const path=cur.dm?'dms/'+cur.dm+'/owner':(cur.sid?'servers/'+cur.sid+'/owner':null);if(!path)return;
  const key=cur.dm||cur.cid;
  try{const v=(await get(ref(db,path))).val();if(key!==(cur.dm||cur.cid))return;ownerUid=v;if(v===me.uid)redraw()}catch{}
}

function clearReply(){replyTo=null;hideReply()}

function jumpTo(id){
  if(!id)return;
  const r=document.querySelector('#msgs .m[data-id="'+CSS.escape(id)+'"]');
  if(!r)return toast('A mensagem original não está mais aqui.');
  r.scrollIntoView({block:'center'});r.classList.add('flash');setTimeout(()=>r.classList.remove('flash'),1700);
}

}
