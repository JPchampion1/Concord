<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e1f22">
<title>Concord</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
@font-face{font-family:"gg sans";src:url("ggsans-Normal.woff2") format("woff2");font-weight:400}
@font-face{font-family:"gg sans";src:url("ggsans-Medium.woff2") format("woff2");font-weight:500}
@font-face{font-family:"gg sans";src:url("ggsans-Semibold.woff2") format("woff2");font-weight:600}
@font-face{font-family:"gg sans";src:url("ggsans-Bold.woff2") format("woff2");font-weight:700}
:root{--brand:#74cc20;--brand-h:#63ad1b;--bg1:#1e1f22;--bg2:#2b2d31;--bg3:#313338;--hov:#35373c;--txt:#f2f3f5;--mut:#949ba4;--inp:#1e1f22;--err:#f23f42}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"gg sans","Noto Sans","Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg3);color:var(--txt);overflow:hidden;font-size:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#auth{height:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 20% 15%,#2f5f12 0,transparent 45%),radial-gradient(circle at 85% 90%,#1d3d0b 0,transparent 50%),var(--bg1)}
.card{width:100%;max-width:480px;background:var(--bg3);border-radius:8px;padding:32px;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.logo{display:block;width:64px;height:64px;margin:0 auto 16px;border-radius:16px}
.card h1{margin:0 0 8px;font-size:24px;font-weight:600;text-align:center}
.card .sub{margin:0 0 20px;text-align:center;color:var(--mut)}
.card label{display:block;margin:16px 0 8px;font-size:12px;font-weight:700;color:#b5bac1;text-transform:uppercase}
.card input{width:100%;height:40px;padding:10px;border:0;border-radius:3px;background:var(--inp)}
.link{background:none;color:var(--brand);padding:0;font-size:14px}
.link:hover{text-decoration:underline}
.btn{width:100%;height:44px;margin-top:20px;border-radius:3px;background:var(--brand);color:#0b1a02;font-weight:600;transition:background-color .17s}
.btn:hover{background:var(--brand-h)}
.err{margin-top:12px;min-height:18px;font-size:14px;color:var(--err)}
.foot{margin-top:8px;font-size:14px;color:var(--mut)}

/* ---------- APP ---------- */
#app{height:100%;display:grid;grid-template-columns:72px 240px 1fr 240px}
#servers{background:var(--bg1);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;overflow-y:auto}
.sv{width:48px;height:48px;border-radius:50%;background:var(--bg3);font-weight:600;transition:border-radius .17s,background-color .17s;position:relative;flex:none}
.sv:hover,.sv.on{border-radius:16px;background:var(--brand);color:#0b1a02}
.sv.add{color:var(--brand);font-size:24px}
.sv.add:hover{color:#0b1a02}
.sep{width:32px;height:2px;background:var(--hov);border-radius:1px;flex:none}
#side{background:var(--bg2);display:flex;flex-direction:column;min-width:0}
#sname{height:48px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:600;border-bottom:1px solid var(--bg1);box-shadow:0 1px 0 rgba(0,0,0,.1)}
#sname button{background:none;color:var(--mut);font-size:12px}
#sname button:hover{color:var(--txt)}
#chans{flex:1;overflow-y:auto;padding:16px 8px}
.chead{display:flex;justify-content:space-between;padding:0 8px 4px;font-size:12px;font-weight:600;color:var(--mut)}
.chead button{background:none;color:var(--mut);font-size:18px;line-height:1}
.chead button:hover{color:var(--txt)}
.ch{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:4px;background:none;color:var(--mut);font-weight:500}
.ch:hover{background:var(--hov);color:#dbdee1}
.ch.on{background:#404249;color:#fff}
.ch i{font-style:normal;opacity:.7;margin-right:6px}
#me{height:52px;background:#232428;display:flex;align-items:center;gap:8px;padding:0 8px}
#me .nm{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#me .nm small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
#me button{background:none;color:var(--mut);font-size:12px;padding:6px;border-radius:4px}
#me button:hover{background:var(--hov);color:var(--txt)}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:15px;color:#0b1a02;position:relative}
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#chtitle{height:48px;padding:0 16px;display:flex;align-items:center;font-weight:600;border-bottom:1px solid var(--bg1);box-shadow:0 1px 0 rgba(0,0,0,.1)}
#chtitle i{font-style:normal;color:var(--mut);margin-right:8px;font-size:22px}
#msgs{flex:1;overflow-y:auto;padding:16px 0}
.empty{padding:32px 16px;color:var(--mut)}
.empty h2{color:var(--txt);margin:0 0 4px}
.m{display:flex;gap:16px;padding:2px 16px 2px 16px}
.m:hover{background:rgba(2,2,2,.06)}
.m.first{margin-top:16px;padding-top:4px}
.m .av{width:40px;height:40px;margin-top:2px}
.m .sp{width:40px;flex:none;font-size:11px;color:var(--mut);text-align:right;opacity:0;line-height:22px}
.m:hover .sp{opacity:1}
.m .bd{min-width:0}
.m .hd{line-height:22px}
.m .hd b{font-weight:600;margin-right:8px}
.m .hd span{font-size:12px;color:var(--mut)}
.m .tx{line-height:22px;white-space:pre-wrap;overflow-wrap:anywhere;color:#dbdee1}
#form{display:flex;gap:8px;padding:0 16px 24px}
#form input{width:100%;height:44px;padding:0 16px;border:0;border-radius:8px;background:#383a40}
#form input::placeholder{color:var(--mut)}
#members{background:var(--bg2);overflow-y:auto;padding:16px 8px}
#members h3{margin:8px 8px 4px;font-size:12px;font-weight:600;color:var(--mut)}
.mb{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:4px;font-weight:500}
.mb:hover{background:var(--hov)}
.mb.off{opacity:.45}
.mb .av{width:32px;height:32px;font-size:13px}
.dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:#23a55a;border:3px solid var(--bg2);box-sizing:content-box;width:10px;height:10px}
.mb.off .dot{background:#80848e}
/* ---------- MODAIS ---------- */
#ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.7)}
.md{position:relative;width:100%;max-width:440px;max-height:100%;overflow-y:auto;background:var(--bg2);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.md .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:4px;background:none;color:var(--mut);font-size:26px;line-height:1}
.md .x:hover{color:var(--txt)}
.md .pad{padding:24px 16px 16px}
.md h2{margin:8px 24px;text-align:center;font-size:24px;line-height:30px;font-weight:600}
.md p{margin:8px 8px 20px;text-align:center;color:#b5bac1;line-height:20px}
.md .lb{display:block;margin:4px 0 8px;font-size:12px;font-weight:700;color:#b5bac1;text-transform:uppercase}
.md input{width:100%;height:40px;padding:10px;border:0;border-radius:3px;background:var(--inp)}
.opt{display:flex;align-items:center;gap:16px;width:100%;height:60px;padding:0 16px;border:1px solid #3f4147;border-radius:8px;background:var(--bg3);font-weight:500;text-align:left}
.opt:hover{background:var(--hov)}
.opt .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--brand);color:#0b1a02;font-weight:700;font-size:20px}
.opt .arr{margin-left:auto;color:var(--mut);font-size:22px}
.foot1{padding:0 16px 16px;text-align:center}
.foot1 h3{margin:8px 0 16px;font-size:20px;font-weight:600}
.foot2{display:flex;justify-content:space-between;gap:8px;padding:16px;background:#232428}
.b2{height:38px;padding:0 16px;border-radius:3px;font-weight:500;transition:background-color .17s}
.b2.wide{width:100%}
.b2.sec{background:#4e5058}.b2.sec:hover{background:#6d6f78}
.b2.pri{background:var(--brand);color:#0b1a02}.b2.pri:hover{background:var(--brand-h)}
.b2.lnk{background:none}.b2.lnk:hover{text-decoration:underline}
.copy{display:flex;gap:8px}.copy input{flex:1}
/* ---------- CONVITE POR LINK ---------- */
.tx a{color:var(--brand);text-decoration:none}
.tx a:hover{text-decoration:underline}
.inv{margin-top:8px;max-width:432px;padding:16px;border:1px solid #232428;border-radius:8px;background:var(--bg2)}
.md .inv{margin:0 0 4px;background:var(--bg3);max-width:none}
.inv .invh{margin-bottom:12px;font-size:12px;font-weight:700;color:var(--mut)}
.inv .invr{display:flex;align-items:center;gap:16px}
.invic{width:50px;height:50px;border-radius:16px;flex:none;display:grid;place-items:center;background:var(--brand);color:#0b1a02;font-weight:700}
.invi{flex:1;min-width:0}
.invi b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.invi small{color:var(--mut)}
.inv .b2:disabled{opacity:.5;cursor:default}
/* ---------- MENSAGENS DIRETAS ---------- */
.sv.home,.sv.home:hover,.sv.home.on{background:url(logo.png) center/cover}
.sv.home{opacity:.85}
.sv.home:hover,.sv.home.on{opacity:1}
.find{width:100%;height:28px;margin-bottom:12px;padding:0 8px;border-radius:4px;background:var(--bg1);color:var(--mut);font-size:13px;text-align:left}
.ch.dm{display:flex;align-items:center;gap:12px;padding:6px 8px}
.ch.dm .av{width:32px;height:32px;font-size:13px}
.ch.dm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chans .empty{padding:16px 8px;font-size:14px}
.ulist{max-height:260px;overflow-y:auto;margin-top:8px}
.urow{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border-radius:4px;background:none;text-align:left;font-weight:500;cursor:pointer}
.urow:hover{background:var(--hov)}
.urow .av{width:32px;height:32px;font-size:13px}
.md .urow input{width:18px;height:18px;padding:0;accent-color:var(--brand)}
.uempty{padding:16px;text-align:center;color:var(--mut)}
/* ---------- PERFIL ---------- */
#me .av,#me .nm,.mb,.lk{cursor:pointer}
.hd b.lk:hover{text-decoration:underline}
.md:has(.pbanner) .x{color:#0b1a02}
.pbanner{height:100px;background:var(--brand)}
.pbody{padding:0 16px 16px}
.av.big{width:92px;height:92px;border:6px solid var(--bg2);margin-top:-46px;font-size:38px;cursor:default}
.pname{margin-top:8px;font-size:20px;font-weight:700;overflow-wrap:anywhere}
.pst{font-size:14px;color:var(--mut)}
.av.big .dot{width:18px;height:18px;right:-6px;bottom:-6px;border-width:5px;border-color:var(--bg2)}
.dot.off{background:#80848e}
.pst:empty{display:none}
.pact{margin:16px 0}
.pcard{padding:12px;border-radius:8px;background:var(--bg1)}
.pcard h4{margin:0 0 4px;font-size:12px;font-weight:700;color:#b5bac1}
.pcard div+h4{margin-top:16px}
.pbio{font-size:14px;line-height:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.pbio.nil{color:var(--mut)}
.md textarea{width:100%;min-height:96px;resize:vertical;padding:10px;border:0;border-radius:3px;background:var(--inp);font:inherit;color:inherit}
/* ---------- EDIÇÃO NO PERFIL E IMAGENS ---------- */
.ed{cursor:text;border-radius:4px;transition:background-color .17s}
.ed:hover{background:var(--hov)}
.pname.ed{margin-left:-4px;padding:2px 4px}
.pbio.ed{margin:-4px;padding:4px}
.md .ei{width:100%;height:auto;padding:6px 8px;border:0;border-radius:3px;background:var(--inp);color:inherit;font:inherit;outline:2px solid var(--brand)}
.md textarea.ei{min-height:84px;resize:vertical}
.av.chg{cursor:pointer}
.av.chg:hover::after{content:"Trocar";position:absolute;inset:0;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600}
.phint{margin-top:12px;min-height:16px;font-size:12px;color:var(--mut)}
.phint .link{margin-left:8px;font-size:12px}
#attach{width:44px;height:44px;flex:none;border-radius:8px;background:#383a40;color:var(--mut);font-size:24px}
#attach:hover:not(:disabled){color:var(--txt)}
#attach:disabled{opacity:.5;cursor:default}
.pic{margin-top:4px;max-width:100%;border-radius:8px;overflow:hidden;background:var(--bg2);cursor:zoom-in}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.lbimg{max-width:100%;max-height:100%;border-radius:8px;cursor:zoom-out}
.pact{display:flex;gap:8px;align-items:center}
.pact:empty,.pfoot:empty{display:none}
.pfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.phint{margin-top:8px;font-size:13px;color:var(--err)}
.phint:empty{display:none}
/* ---------- AMIGOS ---------- */
.puser{font-size:14px;color:var(--mut)}.puser:empty{display:none}
.ch.dm .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch.dm small,.rq small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.rq{display:flex;align-items:center;gap:12px;padding:6px 8px}
.rq .av{width:32px;height:32px;font-size:13px}
.rq .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.rqb{width:32px;height:32px;border-radius:50%;background:var(--bg1);color:var(--mut);font-size:16px}
.rqb:hover{color:var(--txt)}.rqb.ok:hover{background:var(--brand);color:#0b1a02}
.at{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border-radius:3px;background:var(--inp)}
.at b{color:var(--mut)}.md .at input{height:100%;padding:0;background:none}
.ok2{color:var(--brand)}
body[data-req]:not([data-req="0"]) #homeBtn::after{content:"";position:absolute;right:-2px;top:-2px;width:12px;height:12px;border-radius:50%;background:var(--err);border:3px solid var(--bg1);box-sizing:content-box}
/* ---------- STATUS ---------- */
#meSt{cursor:pointer}#meSt:hover{text-decoration:underline;color:var(--txt)}
.sdot{position:relative;display:inline-block;width:16px;height:16px;border-radius:50%;flex:none}
.dot.online,.sdot.online{background:#23a55a}
.dot.idle,.sdot.idle,body[data-st="idle"] #meAv .dot{background:#f0b232}
.dot.dnd,.sdot.dnd,body[data-st="dnd"] #meAv .dot{background:#f23f42}
.dot.off,.sdot.off,body[data-st="offline"] #meAv .dot{background:#80848e}
.dot.idle::after,.sdot.idle::after,body[data-st="idle"] #meAv .dot::after{content:"";position:absolute;width:60%;height:60%;left:-12%;top:-12%;border-radius:50%;background:var(--bg2)}
.dot.dnd::after,.sdot.dnd::after,body[data-st="dnd"] #meAv .dot::after{content:"";position:absolute;left:18%;right:18%;top:40%;height:20%;border-radius:2px;background:var(--bg2)}
.sdot.idle::after,.sdot.dnd::after{background:var(--bg3)}
.stl .opt+.opt{margin-top:8px}
.opt.on{border-color:var(--brand)}
.stt{display:flex;flex-direction:column;font-weight:500}
.stt small{font-weight:400;font-size:12px;color:var(--mut)}
/* ---------- CONFIGURAÇÕES ---------- */
body[data-theme="black"]{--bg1:#000;--bg2:#0b0b0c;--bg3:#111113;--hov:#1b1b1e;--inp:#000}
#settings{position:fixed;inset:0;z-index:9;display:flex;background:var(--bg3)}
#settings nav{width:260px;flex:none;display:flex;flex-direction:column;gap:2px;padding:48px 12px 16px;overflow-y:auto;background:var(--bg2)}
#settings nav h3{margin:8px 10px;font-size:12px;text-transform:uppercase;color:var(--mut)}
.sn{padding:8px 10px;border-radius:4px;background:none;color:var(--mut);text-align:left;font-weight:500}
.b2.sn,.b2.th{height:auto}
.sn:hover{background:var(--hov);color:var(--txt)}.sn.on{background:#404249;color:#fff}.sn.red{color:var(--err);margin-top:8px}
#settings section{flex:1;min-width:0;overflow-y:auto;padding:48px 40px}
.sc{max-width:660px}.sc h1{margin:0 0 12px;font-size:20px}.sc h1+.sr{border-top:1px solid var(--bg1)}.sc .sr+h1{margin-top:32px}
.sr{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--bg1)}
.sr .lbl{flex:1;min-width:0}.sr .lbl b{display:block;font-weight:600}.sr .lbl small{display:block;margin-top:2px;font-size:13px;color:var(--mut)}
.sr .val{max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sx{position:fixed;top:12px;right:16px;width:36px;height:36px;border-radius:50%;border:2px solid var(--mut);background:none;color:var(--mut);font-size:16px}
.sx:hover{color:var(--txt);border-color:var(--txt)}
.sw{position:relative;width:40px;height:24px;flex:none}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:12px;background:#80848e;transition:background-color .17s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .17s}
.sw input:checked+i{background:var(--brand)}.sw input:checked+i::after{left:19px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swt{width:36px;height:36px;border-radius:50%;border:3px solid transparent;background-clip:padding-box;box-shadow:0 0 0 0 var(--txt)}
.swt.on{border-color:var(--bg3);box-shadow:0 0 0 2px var(--txt)}
.themes{display:flex;gap:12px}
.th{flex:1;padding:14px;border-radius:8px;border:2px solid #3f4147;background:var(--bg2);text-align:left;font-weight:500}
.th.on{border-color:var(--brand)}
#settings input[type=range]{width:200px;accent-color:var(--brand)}
@media(max-width:700px){
  #settings{flex-direction:column}
  #settings nav{width:auto;flex-direction:row;gap:4px;overflow-x:auto;padding:calc(8px + env(safe-area-inset-top,0px)) 56px 8px 8px}
  #settings nav h3{display:none}.sn,.sn.red{white-space:nowrap;margin:0}
  #settings section{padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px))}
  .sx{top:calc(8px + env(safe-area-inset-top,0px));right:10px}
  .sr .val{max-width:34%}#settings input[type=range]{width:120px}
}
/* ---------- CELULAR / TABLET ---------- */
#top{display:contents}
#navBtn,#memBtn{display:none;width:40px;height:40px;flex:none;border-radius:8px;background:none;color:var(--mut);font-size:22px;line-height:1}
#navBtn:active,#memBtn:active{background:var(--hov);color:var(--txt)}
#scrim{display:none;position:fixed;inset:0;z-index:7;background:rgba(0,0,0,.55)}
@media(max-width:900px){
  #app{grid-template-columns:72px 200px 1fr}
  #memBtn{display:block}
  #members{position:fixed;top:0;right:0;bottom:0;width:min(82vw,300px);z-index:8;transform:translateX(100%);transition:transform .22s ease;box-shadow:-8px 0 24px rgba(0,0,0,.4);padding-top:max(16px,env(safe-area-inset-top))}
  #app.mem-open #members{transform:none}
  #app.mem-open~#scrim{display:block}
}
@media(max-width:700px){
  #app{height:100dvh;grid-template-columns:1fr}
  #navBtn{display:block}
  #top{display:flex;align-items:center;gap:4px;height:calc(48px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 8px 0;border-bottom:1px solid var(--bg1);box-shadow:0 1px 0 rgba(0,0,0,.1)}
  #chtitle{flex:1;min-width:0;height:48px;padding:0 4px;border:0;box-shadow:none;overflow:hidden;white-space:nowrap}
  #servers{position:fixed;top:0;bottom:0;left:0;width:64px;z-index:8;transform:translateX(-100%);transition:transform .22s ease;padding-top:max(12px,env(safe-area-inset-top))}
  #side{position:fixed;top:0;bottom:0;left:64px;width:min(calc(88vw - 64px),266px);z-index:8;transform:translateX(calc(-100% - 64px));transition:transform .22s ease;padding-top:env(safe-area-inset-top,0px)}
  #app.nav-open #servers,#app.nav-open #side{transform:none}
  #app.nav-open~#scrim{display:block}
  #me{height:calc(52px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
  .ch{padding:10px 8px}
  .m{gap:12px;padding:2px 12px}
  .m.first{margin-top:12px}
  #form{padding:0 8px calc(12px + env(safe-area-inset-bottom,0px))}
  #form input,.card input,.md input,.md textarea{font-size:16px}

<body>

<!-- LOGIN / REGISTRO (sem QR code) -->
<div id="auth">

<!-- APP -->
<div id="app" class="hidden">
  <nav id="servers" aria-label="Servidores"></nav>
  <aside id="side">
    <div id="sname"><span id="sTitle">Concord</span><button id="invite" class="hidden" title="Copiar código de convite">Convite</button></div>
    <div id="chans"></div>
    <div id="me">
      <div class="av" id="meAv"><span class="dot"></span></div>
      <div class="nm"><span id="meName"></span><small id="meSt" title="Mudar status">Online</small></div>
      <button id="setBtn" title="Configurações" aria-label="Configurações">⚙</button>
      <button id="logout" title="Sair">Sair</button>
    </div>
  </aside>
  <main id="main">
    <div id="top"><button id="navBtn" aria-label="Abrir menu">☰</button><div id="chtitle"></div><button id="memBtn" aria-label="Membros">👥</button></div>
    <div id="msgs"></div>
    <form id="form"><button type="button" id="attach" title="Enviar imagem">+</button><input id="msgIn" autocomplete="off" disabled placeholder="Selecione um canal"></form>
  </main>
  <aside id="members"></aside>
</div>

<div id="settings" class="hidden"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,updateProfile,signOut,sendPasswordResetEmail,reauthenticateWithCredential,EmailAuthProvider,updatePassword,verifyBeforeUpdateEmail} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getDatabase,ref,push,set,get,update,onValue,onChildAdded,query,limitToLast,onDisconnect,remove} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const app=initializeApp({
  apiKey:"AIzaSyBJsPaZOArWDvpzEz5sPCxBaJe_Yf7eoTg",
  authDomain:"concord-cdc9c.firebaseapp.com",
  databaseURL:"https://concord-cdc9c-default-rtdb.firebaseio.com",
  projectId:"concord-cdc9c",
  storageBucket:"concord-cdc9c.firebasestorage.app",
  messagingSenderId:"663376374883",
  appId:"1:663376374883:web:7f55fe6f4bec11bea09c56"
});
const auth=getAuth(app), db=getDatabase(app);
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const colorOf=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 60% 62%)`};
let photos={};
const applyPhoto=a=>{const p=photos[a.dataset.uid];a.style.backgroundImage=p?`url("${p}")`:'';a.style.backgroundSize='cover';a.style.backgroundPosition='center';a.style.color=p?'transparent':''};
const avatar=(name,uid)=>{const a=el('div','av',(name||'?')[0].toUpperCase());a.dataset.uid=uid||name;a.style.background=colorOf(uid||name);applyPhoto(a);return a};
// reduz a imagem no navegador e devolve base64 (data URL JPEG)
function shrink(file,max,q,square){
  return new Promise((ok,no)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.width,h=img.height,sx=0,sy=0,sw=w,sh=h;
      if(square){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;sw=sh=m;w=h=Math.min(max,m)}
      else{const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k)}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,sx,sy,sw,sh,0,0,w,h);
      ok({url:c.toDataURL('image/jpeg',q),w,h});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);no(new Error('img'))};
    img.src=url;
  });
}

/* ---------- Login / registro ---------- */
let reg=false;
const msgs={'auth/invalid-credential':'E-mail ou senha inválidos.','auth/email-already-in-use':'Esse e-mail já está em uso.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/invalid-email':'E-mail inválido.','auth/too-many-requests':'Muitas tentativas. Tente de novo mais tarde.','auth/operation-not-allowed':'Ative o login por e-mail/senha no Firebase.'};
const fail=e=>$('aErr').textContent=msgs[e.code]||('Erro: '+e.code);
function mode(r){
  reg=r;$('aErr').textContent='';
  $('nameWrap').classList.toggle('hidden',!r);
  $('aTitle').textContent=r?'Crie uma conta':'Bem-vindo de volta!';
  $('aSub').textContent=r?'Entre para o Concord.':'Estamos muito animados em ver você de novo!';
  $('aBtn').textContent=r?'Continuar':'Entrar';
  $('aAsk').textContent=r?'Já tem uma conta?':'Precisa de uma conta?';
  $('aSwitch').textContent=r?'Entrar':'Registre-se';
  $('forgot').classList.toggle('hidden',r);
}
$('aSwitch').onclick=()=>mode(!reg);
$('forgot').onclick=async()=>{
  const e=$('aEmail').value.trim();
  if(!e){$('aErr').textContent='Digite seu e-mail primeiro.';return}
  try{await sendPasswordResetEmail(auth,e);$('aErr').style.color='#7fd33a';$('aErr').textContent='Enviamos um link de redefinição para o seu e-mail.'}catch(x){fail(x)}
};
$('authForm').onsubmit=async ev=>{
  ev.preventDefault();$('aErr').style.color='';$('aErr').textContent='';
  const em=$('aEmail').value.trim(),pw=$('aPass').value;
  try{
    if(reg){
      const name=$('aName').value.trim()||em.split('@')[0],handle=cleanUser($('aUser').value);
      if(!UN_RE.test(handle))return $('aErr').textContent='O @ deve ter de 2 a 20 caracteres: letras minúsculas, números, _ ou .';
      regBusy=true;
      const c=await createUserWithEmailAndPassword(auth,em,pw);
      await updateProfile(c.user,{displayName:name});
      await update(ref(db,'users/'+c.user.uid),{name});
      $('meName').textContent=name;$('meAv').replaceWith(Object.assign(avatar(name,c.user.uid),{id:'meAv'}));
      try{await claimUsername(handle)}catch{}
      regBusy=false;ensureUsername(); // se o @ já existir, pede outro
    }else await signInWithEmailAndPassword(auth,em,pw);
  }catch(x){regBusy=false;fail(x)}
};
$('logout').onclick=()=>signOut(auth);
$('meSt').onclick=e=>{e.stopPropagation();statusView()};
$('me').onclick=e=>{if(!e.target.closest('#logout,#setBtn'))profileView(me.uid)};

/* ---------- Estado ---------- */
let inviteParam=new URLSearchParams(location.search).get('convite');
let me=null,cur={sid:null,cid:null},un={srv:null,ch:null,mem:null,msg:null},pres={},members={},last=null;
const stop=k=>{if(un[k]){un[k]();un[k]=null}};

const ST={online:['Online','Disponível'],idle:['Ausente','Você parece estar fora'],dnd:['Não perturbe','Sem notificações'],offline:['Offline','Você aparece offline para todos']};
const stOf=v=>v===true?'online':(ST[v]?v:'offline'),stCls=st=>st==='offline'?'off':st;
let myStatus='online';
const paintMe=()=>{document.body.dataset.st=myStatus;$('meSt').textContent=ST[myStatus][0]};
async function setStatus(st){
  myStatus=st;paintMe();closeModal();
  try{await set(ref(db,'presence/'+me.uid),st);await update(ref(db,'users/'+me.uid),{status:st})}catch{}
}
function statusView(){
  const d=view('<div class="pad"><h2>Definir status</h2><p>Escolha como você aparece para os outros.</p><div class="stl"></div></div>');
  for(const k of Object.keys(ST)){
    const b=el('button','opt'+(k===myStatus?' on':''));
    b.innerHTML=`<span class="sdot ${stCls(k)}"></span><span class="stt">${ST[k][0]}<small>${ST[k][1]}</small></span>`;
    b.onclick=()=>setStatus(k);d.querySelector('.stl').append(b);
  }
  showModal(d);
}
const UN_RE=/^[a-z0-9_.]{2,20}$/,cleanUser=v=>v.trim().replace(/^@/,'').toLowerCase();
let regBusy=false,myUser='',friendList={},reqList={},dmList={};
async function claimUsername(h){
  const u=auth.currentUser;
  try{await set(ref(db,'usernames/'+h),u.uid)}catch{throw 'Esse @ já está em uso.'}
  await update(ref(db,'users/'+u.uid),{username:h});myUser=h;
}
async function ensureUsername(){
  let v;try{v=(await get(ref(db,'users/'+auth.currentUser.uid+'/username'))).val()}catch{return}
  if(v){myUser=v;return}
  const d=view(`<div class="pad"><h2>Escolha seu @</h2><p>Seu @ é único: é com ele que seus amigos te encontram. Use letras minúsculas, números, _ ou .</p>
    <label class="lb" for="mIn">Nome de usuário</label><div class="at"><b>@</b><input id="mIn" maxlength="20" autocomplete="off" autocapitalize="none"></div><div class="err"></div></div>
    <div class="foot2"><span></span><button class="b2 pri" id="mOk">Salvar</button></div>`);
  const inp=d.querySelector('#mIn');
  inp.value=(auth.currentUser.displayName||'').toLowerCase().replace(/[^a-z0-9_.]/g,'').slice(0,20);
  const go=async()=>{
    const h=cleanUser(inp.value);
    if(!UN_RE.test(h))return say(d,'Use de 2 a 20 caracteres: letras minúsculas, números, _ ou .');
    try{await claimUsername(h);closeModal()}catch(e){say(d,typeof e==='string'?e:'Não foi possível salvar.')}
  };
  d.querySelector('#mOk').onclick=go;enter(inp,go);
  showModal(d);lockModal=true;d.parentNode.querySelector('.x')?.remove();
}
onAuthStateChanged(auth,u=>{
  me=u;
  $('auth').classList.toggle('hidden',!!u);
  $('app').classList.toggle('hidden',!u);
  if(!u){['srv','ch','mem','msg','dm','fr','rq'].forEach(stop);friendList={};reqList={};myUser='';cur={sid:null,cid:null};return}
  const name=u.displayName||u.email.split('@')[0];
  $('meName').textContent=name;
  $('meAv').replaceWith(Object.assign(avatar(name,u.uid),{id:'meAv'}));
  $('meAv').insertAdjacentHTML('beforeend','<span class="dot"></span>');
  update(ref(db,'users/'+u.uid),{name,createdAt:Date.parse(u.metadata.creationTime)||Date.now()}).catch(()=>{});
  if(!regBusy)ensureUsername();
  stop('fr');un.fr=onValue(ref(db,'friends/'+u.uid),s=>{friendList=s.val()||{};if(cur.home)drawDms()});
  stop('rq');un.rq=onValue(ref(db,'friendRequests/'+u.uid),s=>{reqList=s.val()||{};document.body.dataset.req=Object.keys(reqList).length;if(cur.home)drawDms()});
  // presença
  const pr=ref(db,'presence/'+u.uid);
  get(ref(db,'users/'+u.uid+'/status')).then(v=>v.val()).catch(()=>null).then(v=>{
    myStatus=ST[v]?v:'online';paintMe();
    onValue(ref(db,'.info/connected'),s=>{if(s.val()){onDisconnect(pr).set('offline');set(pr,myStatus)}});
  });
  onValue(ref(db,'presence'),s=>{pres=s.val()||{};drawMembers()});
  onValue(ref(db,'avatars'),s=>{photos=s.val()||{};document.querySelectorAll('.av[data-uid]').forEach(applyPhoto)});
  // servidores
  stop('srv');
  un.srv=onValue(ref(db,'userServers/'+u.uid),s=>{
    const list=s.val()||{};drawServers(list);
    if(!list[cur.sid]&&!cur.home){const first=Object.keys(list)[0];first?pickServer(first,list[first].name):goHome()}
  });
  if(inviteParam){const k=inviteParam;inviteParam=null;history.replaceState(null,'',location.pathname);inviteModal(k)}
});

/* ---------- Servidores ---------- */
function drawServers(list){
  const nav=$('servers');nav.innerHTML='';
  const hb=el('button','sv home'+(cur.home?' on':''));hb.id='homeBtn';hb.title='Mensagens diretas';
  hb.onclick=()=>{if(!cur.home)goHome()};nav.append(hb,el('div','sep'));
  for(const [sid,s] of Object.entries(list)){
    const b=el('button','sv'+(sid===cur.sid?' on':''),s.name.slice(0,2).toUpperCase());
    b.title=s.name;b.onclick=()=>pickServer(sid,s.name);nav.append(b);
  }
  nav.append(el('div','sep'));
  const add=el('button','sv add','+');add.title='Adicionar um servidor';add.onclick=chooseView;
  nav.append(add);
}
/* ---------- Janelas (modais) ---------- */
const myName=()=>me.displayName||me.email.split('@')[0];
const ov=$('ov');
function showModal(node){
  ov.innerHTML='';const m=el('div','md');
  const x=el('button','x','×');x.setAttribute('aria-label','Fechar');x.onclick=closeModal;
  m.append(x,node);ov.append(m);ov.classList.remove('hidden');
  const i=m.querySelector('input');if(i){i.focus();i.select()}
}
let lockModal=false;
function closeModal(){lockModal=false;ov.classList.add('hidden');ov.innerHTML=''}
// ---------- CELULAR: menus laterais (servidores/canais e membros) ----------
const appEl=$('app'),isMob=()=>matchMedia('(max-width:700px)').matches,isTab=()=>matchMedia('(max-width:900px)').matches;
const setNav=o=>{appEl.classList.toggle('nav-open',o);if(o)appEl.classList.remove('mem-open')};
const setMem=o=>{appEl.classList.toggle('mem-open',o);if(o)appEl.classList.remove('nav-open')};
$('navBtn').onclick=()=>setNav(!appEl.classList.contains('nav-open'));
$('memBtn').onclick=()=>setMem(!appEl.classList.contains('mem-open'));
$('scrim').onclick=()=>{setNav(false);setMem(false)};
$('chans').addEventListener('click',e=>{if(isMob()&&e.target.closest('.ch'))setNav(false)});
if(isMob())setNav(true); // abre no menu de canais, como o Discord
let tx=0,ty=0;
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  if(!ov.classList.contains('hidden')||appEl.classList.contains('hidden'))return;
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const n=appEl.classList.contains('nav-open'),m=appEl.classList.contains('mem-open');
  if(dx>0){if(m)setMem(false);else if(isMob()&&!n)setNav(true)}
  else{if(n)setNav(false);else if(!m&&isTab())setMem(true)}
},{passive:true});
ov.onmousedown=e=>{if(e.target===ov&&!lockModal)closeModal()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const view=h=>{const d=el('div');d.innerHTML=h;return d};
const say=(d,t)=>d.querySelector('.err').textContent=t;
const enter=(inp,fn)=>inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();fn()}};

function chooseView(){
  const d=view(`<div class="pad"><h2>Criar seu servidor</h2><p>Seu servidor é onde você e seus amigos se reúnem. Crie o seu e comece a interagir.</p>
    <button class="opt" id="oCreate"><span class="ic">+</span>Criar o meu<span class="arr">›</span></button></div>`);
  d.querySelector('#oCreate').onclick=createView;
  showModal(d);
}
function createView(){
  const d=view(`<div class="pad"><h2>Personalize seu servidor</h2><p>Dê uma personalidade ao seu novo servidor escolhendo um nome.</p>
    <label class="lb" for="mIn">Nome do servidor</label><input id="mIn" maxlength="32"><div class="err"></div></div>
    <div class="foot2"><button class="b2 lnk" id="mBack">Voltar</button><button class="b2 pri" id="mOk">Criar</button></div>`);
  const inp=d.querySelector('#mIn');inp.value='Servidor de '+myName();
  const go=async()=>{
    const name=inp.value.trim();if(!name)return say(d,'Dê um nome ao servidor.');
    try{await createServer(name)}catch{say(d,'Não foi possível criar. Confira as regras do banco de dados.')}
  };
  d.querySelector('#mBack').onclick=chooseView;d.querySelector('#mOk').onclick=go;enter(inp,go);
  showModal(d);
}
async function profileView(uid){
  const isMe=uid===me.uid;let u={};
  try{u=(await get(ref(db,'users/'+uid))).val()||{}}catch{}
  let name=isMe?myName():(u.name||'Usuário'),bio=u.bio||'';
  const since=isMe&&me.metadata.creationTime?Date.parse(me.metadata.creationTime):u.createdAt;
  const d=view(`<div class="pbanner"></div><div class="pbody"><div class="pav"></div><div class="pname"></div><div class="puser"></div><div class="pst"></div><div class="pact"></div>
    <div class="pcard"><h4>Sobre mim</h4><div class="pbio"></div><h4>Membro desde</h4><div class="psince"></div></div><div class="phint"></div><div class="pfoot"></div></div>`);
  const av=avatar(name,uid);av.classList.add('big');d.querySelector('.pav').append(av);
  const nm=d.querySelector('.pname'),bo=d.querySelector('.pbio'),act=d.querySelector('.pact'),hint=d.querySelector('.phint'),foot=d.querySelector('.pfoot');
  const dot=el('span','dot '+stCls(stOf(pres[uid])));av.append(dot); // bolinha de status no avatar
  d.querySelector('.psince').textContent=since?new Date(since).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}):'—';

  const show=()=>{ // modo visualização
    nm.textContent=name;
    bo.textContent=bio||(isMe?'Você ainda não escreveu nada. Clique em Editar perfil.':'Nenhuma descrição.');
    bo.classList.toggle('nil',!bio);
    act.innerHTML='';foot.innerHTML='';hint.textContent='';applyPhoto(av);
    d.querySelector('.puser').textContent=(isMe?myUser:u.username)?'@'+(isMe?myUser:u.username):'';
    if(isMe){const b=el('button','b2 pri','Editar perfil');b.onclick=edit;act.append(b)}
    else if(friendList[uid]){const b=el('button','b2 pri','Enviar mensagem');b.onclick=()=>openDm({uid,name}).catch(()=>{});act.append(b)}
    else{const b=el('button','b2 pri','Adicionar amigo');b.onclick=async()=>{
      try{const r=await requestTo(uid);b.textContent=r==='accepted'?'Amigos':'Pedido enviado';b.disabled=true}catch(e){hint.textContent=typeof e==='string'?e:'Não foi possível enviar o pedido.'}};act.append(b)}
  };
  const edit=()=>{ // modo edição
    let photo; // undefined = sem mudança, null = remover, texto = nova foto
    const ni=document.createElement('input'),bi=document.createElement('textarea');
    ni.className=bi.className='ei';ni.maxLength=24;bi.maxLength=190;ni.value=name;bi.value=bio;
    ni.setAttribute('aria-label','Nome de exibição');bi.setAttribute('aria-label','Sobre mim');
    nm.textContent='';nm.append(ni);bo.textContent='';bo.classList.remove('nil');bo.append(bi);
    act.innerHTML='';foot.innerHTML='';hint.textContent='';
    const preview=url=>{av.style.backgroundImage=url?`url("${url}")`:'';av.style.color=url?'transparent':''};
    const pick=el('button','b2 sec','Trocar foto');
    pick.onclick=()=>{
      const fi=document.createElement('input');fi.type='file';fi.accept='image/*';
      fi.onchange=async()=>{
        const f=fi.files[0];if(!f)return;
        try{photo=(await shrink(f,128,.82,true)).url;preview(photo)}catch{hint.textContent='Não foi possível ler essa imagem.'}
      };
      fi.click();
    };
    act.append(pick);
    if(photos[uid]){const rm=el('button','b2 lnk','Remover foto');rm.onclick=()=>{photo=null;preview(null)};act.append(rm)}
    const cancel=el('button','b2 lnk','Cancelar'),save=el('button','b2 pri','Salvar');
    cancel.onclick=show;
    save.onclick=async()=>{
      const n=ni.value.trim(),b=bi.value.trim();
      if(!n){hint.textContent='O nome não pode ficar vazio.';return}
      save.disabled=true;
      try{
        await saveProfile(n,b);
        if(photo)await set(ref(db,'avatars/'+uid),photo);
        else if(photo===null)await remove(ref(db,'avatars/'+uid));
        if(photo)photos[uid]=photo;else if(photo===null)delete photos[uid];
        name=n;bio=b;show();
      }catch{save.disabled=false;hint.textContent='Não foi possível salvar. Tente de novo.'}
    };
    ni.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();save.click()}};
    bi.onkeydown=e=>{if(e.key==='Enter'&&e.ctrlKey){e.preventDefault();save.click()}};
    foot.append(cancel,save);ni.focus();ni.select();
  };
  show();showModal(d);
}
async function saveProfile(name,bio){
  const changed=name!==myName();
  if(changed)await updateProfile(me,{displayName:name});
  await update(ref(db,'users/'+me.uid),{name,bio});
  $('meName').textContent=name;
  $('meAv').replaceWith(Object.assign(avatar(name,me.uid),{id:'meAv'}));
  $('meAv').insertAdjacentHTML('beforeend','<span class="dot"></span>');
  if(!changed)return;
  try{ // atualiza o nome nas listas de membros e conversas
    const [sv,dm]=await Promise.all([get(ref(db,'userServers/'+me.uid)),get(ref(db,'userDms/'+me.uid))]);
    const up={};

  if(uid===me.uid)throw 'Você não pode adicionar a si mesmo.';

  if(reqList[uid]){await acceptRequest(uid);return 'accepted'}

  await set(ref(db,'friendRequests/'+uid+'/'+me.uid),{name:myName(),username:myUser,ts:Date.now()});
  return 'sent';
}

/* ---------- Convite por link ---------- */
const KEY=/^[-\w]{10,}$/;
const linkOf=sid=>location.origin+location.pathname+'?convite='+sid;

function richText(text){
  const d=el('div','tx');let i=0,inv=null;
  for(const m of text.matchAll(/https?:\/\/[^\s<>]+/g)){
    d.append(document.createTextNode(text.slice(i,m.index)));
    const a=el('a','',m[0]);a.href=m[0];d.append(a);
    i=m.index+m[0].length;
    if(!inv){try{const k=new URL(m[0]).searchParams.get('convite');if(k&&KEY.test(k))inv=k}catch{}}
  }
  d.append(document.createTextNode(text.slice(i)));
  return [d,inv];
}

function inviteCard(sid,head=true){
  const c=el('div','inv');
  if(head)c.append(el('div','invh','Você foi convidado para entrar em um servidor'));
  const row=el('div','invr'),ic=el('div','invic','…'),info=el('div','invi'),nm=el('b','','Carregando…'),ct=el('small','','\u00a0');
  const btn=el('button','b2 pri','Entrar');btn.disabled=true;
  info.append(nm,ct);row.append(ic,info,btn);c.append(row);
  get(ref(db,'servers/'+sid)).then(s=>{
    if(!s.exists()){ic.textContent='?';nm.textContent='Convite inválido';ct.textContent='Este servidor não existe.';btn.textContent='Entrar';return}
    const v=s.val(),n=Object.keys(v.members||{}).length,joined=!!(v.members&&v.members[me.uid]);
    ic.textContent=v.name.slice(0,2).toUpperCase();nm.textContent=v.name;
    ct.textContent=n+(n===1?' membro':' membros');
    btn.textContent=joined?'Ir para o servidor':'Entrar';btn.disabled=false;
    btn.onclick=async()=>{
      btn.disabled=true;
      try{if(joined){closeModal();pickServer(sid,v.name)}else await joinServer(sid)}
      catch{btn.disabled=false;ct.textContent='Não foi possível entrar. Tente de novo.'}
    };
  }).catch(()=>{nm.textContent='Convite indisponível';ct.textContent='Não foi possível carregar.';ic.textContent='?'});
  return c;
}
function inviteModal(sid){

      const msg=await fn(v);
      if(typeof msg==='string'){d.querySelector('.err').classList.add('ok2');say(d,msg);d.querySelector('#mOk').disabled=true;d.querySelector('#mBack').textContent='Fechar';return}
      closeModal();if(!S.classList.contains('hidden'))openSettings();
    }catch(e){say(d,typeof e==='string'?e:authMsg(e))}
  };
  d.querySelector('#mBack').onclick=closeModal;d.querySelector('#mOk').onclick=go;
  d.querySelectorAll('input').forEach(i=>enter(i,go));showModal(d);
}
const S=$('settings');let sTab='account';
const btn=(t,fn,c='sec')=>{const b=el('button','b2 '+c,t);b.onclick=fn;return b};
const sw=(on,fn)=>{const l=el('label','sw'),i=document.createElement('input');i.type='checkbox';i.checked=on;i.onchange=()=>fn(i.checked);l.append(i,el('i'));return l};
const sRow=(label,desc,...right)=>{const r=el('div','sr'),l=el('div','lbl');l.append(el('b','',label));if(desc)l.append(el('small','',desc));r.append(l,...right);return r};
const PAGES={
  async account(c){
    let u={};try{u=(await get(ref(db,'users/'+me.uid))).val()||{}}catch{}
    c.append(el('h1','','Minha conta'));
    c.append(sRow('Perfil','Foto e "Sobre mim".',btn('Editar perfil',()=>profileView(me.uid))));
    c.append(sRow('Nome de exibição','O nome que as pessoas veem nas mensagens.',el('span','val',myName()),
      btn('Editar',()=>formModal('Nome de exibição','Pode ser diferente do seu @ e pode se repetir.',[{id:'n',label:'Nome',value:myName(),max:24}],'Salvar',async v=>{
        const n=v.n.trim();if(!n)throw 'Digite um nome.';await saveProfile(n,u.bio||'')}))));
    c.append(sRow('Nome de usuário','Seu @ único. Amigos usam ele para te encontrar.',el('span','val','@'+(myUser||'—')),
      btn('Editar',()=>formModal('Nome de usuário','Letras minúsculas, números, _ ou . (2 a 20 caracteres).',[{id:'h',label:'Novo @',value:myUser,max:20}],'Salvar',async v=>{
        const h=cleanUser(v.h);if(!UN_RE.test(h))throw 'Use de 2 a 20 caracteres: letras minúsculas, números, _ ou .';
        if(h===myUser)return;
        const up={['usernames/'+h]:me.uid,['users/'+me.uid+'/username']:h};if(myUser)up['usernames/'+myUser]=null;
        try{await update(ref(db),up)}catch{throw 'Esse @ já está em uso.'}
        myUser=h;Object.keys(friendList).forEach(f=>update(ref(db,'friends/'+f+'/'+me.uid),{username:h}).catch(()=>{}));}))));
    const em=me.email||'',mask=em.replace(/^(.).*(@.*)$/,'$1•••••$2'),ev=el('span','val',mask);let shown=false;
    const show=el('button','link','Mostrar');show.onclick=()=>{shown=!shown;ev.textContent=shown?em:mask;show.textContent=shown?'Ocultar':'Mostrar'};
    c.append(sRow('E-mail',null,ev,show,btn('Editar',()=>formModal('Alterar e-mail','Enviaremos um link de confirmação para o novo endereço.',[{id:'e',label:'Novo e-mail',type:'email',max:100},{id:'p',label:'Senha atual',type:'password',max:100}],'Enviar link',async v=>{
      if(!v.e.trim())throw 'Digite o novo e-mail.';await reauth(v.p);await verifyBeforeUpdateEmail(me,v.e.trim());
      return 'Enviamos o link para o novo e-mail. Ele só muda depois que você confirmar.'}))));
    c.append(sRow('Senha',null,btn('Editar',()=>formModal('Alterar senha','Digite sua senha atual e a nova.',[{id:'a',label:'Senha atual',type:'password',max:100},{id:'n',label:'Nova senha',type:'password',max:100},{id:'c',label:'Confirmar nova senha',type:'password',max:100}],'Alterar',async v=>{
      if(v.n.length<6)throw 'A nova senha precisa ter pelo menos 6 caracteres.';if(v.n!==v.c)throw 'As senhas não conferem.';
      await reauth(v.a);await updatePassword(me,v.n);return 'Senha alterada!'}))));
  },
  async privacy(c){
    let allow=true;try{allow=(await get(ref(db,'users/'+me.uid+'/allowRequests'))).val()!==false}catch{}
    c.append(el('h1','','Privacidade e permissões'));
    c.append(sRow('Pedidos de amizade','Permitir que qualquer pessoa com o seu @ envie pedidos.',sw(allow,v=>update(ref(db,'users/'+me.uid),{allowRequests:v}).catch(()=>{}))));
    c.append(sRow('Mensagens diretas','Só amigos podem conversar com você. Isso não pode ser desativado.'));
    c.append(sRow('Status','Escolha como você aparece para os outros.',btn('Mudar status',statusView)));
    c.append(el('h1','','Seus amigos'));
    const fs=friendsArr();
    if(!fs.length)c.append(el('div','uempty','Você ainda não tem amigos.'));
    for(const f of fs)c.append(sRow(f.name,friendList[f.uid].username?'@'+friendList[f.uid].username:'',btn('Remover',async()=>{
      if(!confirm('Remover '+f.name+' dos amigos?'))return;
      try{await update(ref(db),{['friends/'+me.uid+'/'+f.uid]:null,['friends/'+f.uid+'/'+me.uid]:null})}catch{}
      openSettings()},'lnk')));
  },
  async notif(c){
    c.append(el('h1','','Notificações'));
    const ok='Notification' in window;
    c.append(sRow('Notificações do navegador',ok?'Avisa de novas mensagens quando a aba está em segundo plano. Em "Não perturbe" elas ficam silenciadas.':'Seu navegador não oferece suporte a notificações.',
      ...(ok?[sw(!!P.notif&&Notification.permission==='granted',async on=>{
        P.notif=on&&(await Notification.requestPermission())==='granted';saveP();openSettings()})]:[])));
  },
  async look(c){
    c.append(el('h1','','Aparência'));
    const th=el('div','themes');
    for(const [k,n] of [['dark','Escuro'],['black','Preto (AMOLED)']])th.append(btn(n,()=>{P.theme=k;saveP();applyLook();openSettings()},'th'+((P.theme||'dark')===k?' on':'')));
    c.append(sRow('Tema'),th);
    const sa=el('div','swatches');
    for(const [n,h] of ACC){const b=el('button','swt'+((P.accent||'#74cc20')===h?' on':''));b.style.background=h;b.title=n;b.setAttribute('aria-label',n);b.onclick=()=>{P.accent=h;saveP();applyLook();openSettings()};sa.append(b)}
    c.append(sRow('Cor de destaque'),sa);
    const rg=document.createElement('input');rg.type='range';rg.min=13;rg.max=20;rg.value=P.font||16;
    const lab=el('span','val',(P.font||16)+'px');
    rg.oninput=()=>{P.font=+rg.value;lab.textContent=rg.value+'px';applyLook()};rg.onchange=saveP;
    c.append(sRow('Tamanho da fonte',null,rg,lab));
  }
};
const TABS=[['account','Minha conta'],['privacy','Privacidade e permissões'],['notif','Notificações'],['look','Aparência']];
function openSettings(tab){
  if(typeof tab==='string')sTab=tab;
  S.classList.remove('hidden');S.innerHTML='';
  const nav=el('nav'),sec=el('section'),c=el('div','sc'),x=el('button','sx','✕');x.setAttribute('aria-label','Fechar');x.onclick=closeSettings;
  nav.append(el('h3','','Configurações'));
  for(const [k,n] of TABS)nav.append(btn(n,()=>openSettings(k),'sn'+(k===sTab?' on':'')));
  nav.append(btn('Sair',()=>{closeSettings();signOut(auth)},'sn red'));
  sec.append(c);S.append(nav,sec,x);PAGES[sTab](c);
}
const closeSettings=()=>S.classList.add('hidden');
$('setBtn').onclick=()=>openSettings('account');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!S.classList.contains('hidden')&&ov.classList.contains('hidden'))closeSettings()});
mode(false);
</script>
